server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Hashed build assets (Vite emits content-hashed filenames under /assets/).
    # Filenames change on every build, so they are safe to cache forever — this
    # avoids re-downloading unchanged JS/CSS without ever serving stale code.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Never cache the HTML entry point. The browser must re-fetch it on every
    # reload so a rebuilt app's new hashed asset URLs are picked up immediately
    # — no hard refresh required after a rebuild/recompose.
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # SPA fallback — internal redirect to /index.html re-matches the location
    # above, so client routes also get the no-cache HTML.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy API calls to the backend service on the compose network.
    location /v1/ {
        proxy_pass http://backend:8000/v1/;
        proxy_set_header Host $host;
        proxy_buffering off;  # required for SSE streaming
        proxy_set_header X-Real-IP $remote_addr;
    }
}
