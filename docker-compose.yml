services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-rag}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-rag}
      POSTGRES_DB: ${POSTGRES_DB:-rag}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-rag}"]
      interval: 5s
      timeout: 3s
      retries: 10

  qdrant:
    image: qdrant/qdrant:v1.12.4
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrantdata:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "bash -c ':> /dev/tcp/127.0.0.1/6333' || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: ../docker/backend.Dockerfile
    environment:
      POSTGRES_HOST: postgres
      QDRANT_HOST: qdrant
      ENVIRONMENT: ${ENVIRONMENT:-local}
      # LLM provider (default: anthropic). Forwarded so the configured provider
      # can actually activate in-container — without these the backend silently
      # falls back to the local deterministic provider.
      LLM_PROVIDER: ${LLM_PROVIDER:-anthropic}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-claude-sonnet-4-6}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o-mini}
      # Embedding provider (default in .env.example: openai; local needs no key).
      EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER:-openai}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-text-embedding-3-small}
      EMBEDDING_DIM: ${EMBEDDING_DIM:-1536}
      VOYAGE_API_KEY: ${VOYAGE_API_KEY:-}
      CHUNKING_STRATEGY: ${CHUNKING_STRATEGY:-recursive}
      # So `python scripts/...` and `import app` resolve inside the container.
      PYTHONPATH: /app
    volumes:
      - ragdata:/data
      - ./sample_data:/app/sample_data
      # Mounted so seeding + evaluation scripts/reports work in-container.
      - ./scripts:/app/scripts
      - ./evaluation:/app/evaluation
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_healthy

  frontend:
    build:
      # Root context so the Dockerfile can COPY both frontend/ and docker/nginx.conf.
      context: .
      dockerfile: docker/frontend.Dockerfile
    environment:
      VITE_API_BASE: ${VITE_API_BASE:-/v1}
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  pgdata:
  qdrantdata:
  ragdata:
