name: CI

# Lint → tests → eval gate. All jobs run fully offline (deterministic local
# providers, no API keys or external services), so CI is hermetic and free.
# To gate on real generation quality, add ANTHROPIC_API_KEY as a repo secret and
# raise the EVAL_MIN_* thresholds in the eval-gate job toward production targets.

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install ruff
        run: pip install ruff==0.8.4
      - name: Ruff check (correctness rules)
        run: ruff check .

  test:
    name: Backend tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run pytest (offline, no keys)
        working-directory: backend
        run: pytest -q

  eval-gate:
    name: Eval gate (metric thresholds)
    runs-on: ubuntu-latest
    needs: test
    env:
      # Floors calibrated to pass on the local provider; raise once a real
      # provider key is wired in. Override per-branch in repo/Environment vars.
      EVAL_MIN_RETRIEVAL_RECALL: "0.70"
      EVAL_MIN_ANSWER_CORRECTNESS: "0.15"
      EVAL_MIN_FAITHFULNESS: "0.30"
      EVAL_MIN_CITATION_ACCURACY: "0.25"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run evaluation suite + enforce thresholds
        run: python scripts/check_eval_thresholds.py --name ci --strategy recursive
      - name: Upload evaluation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-report
          path: evaluation/reports/
          if-no-files-found: ignore
